version: v2
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/bufbuild/es:v1.10.0
    out: src/gen
    opt: target=ts,import_extension=none
  - remote: buf.build/connectrpc/es:v1.6.1
    out: src/gen
    opt: target=ts,import_extension=none
