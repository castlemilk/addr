version: '3'

# Keep environment loading at the root; the addr include retains the existing
# task definitions verbatim and flatten preserves their public command names.
dotenv: ['.env.local', '.env']

includes:
  addr:
    taskfile: ./Taskfile.addr.yml
    flatten: true
  rooftam:
    taskfile: ./tools/rooftam/Taskfile.yml
    dir: ./tools/rooftam
