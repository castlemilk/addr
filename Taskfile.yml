    desc: 'AHN 0.5 m DSM/DTM and derived nDSM for Utrecht/Rotterdam: COG + R*Tree catalog + hillshade and 3D preview; CLI_ARGS="--out /Volumes/gamma-systems-2/addr-imagery/elevation --aoi utrecht"'
    cmds:
      - 'scripts/ml/training/.venv/bin/python -m scripts.ml.elevation_spike {{.CLI_ARGS}}'

  imagery:citygml-labels:
    desc: 'swissBUILDINGS3D roof labels (mask/height/z/pitch/usage/instance id) rasterised onto the DSM grid; CLI_ARGS="--aoi zurich --grid /Volumes/gamma-systems-2/addr-imagery/elevation/zurich/dsm_05m.tif --out /Volumes/gamma-systems-2/addr-imagery/labels/zurich"'
    cmds:
      - 'scripts/ml/training/.venv/bin/python -m scripts.ml.citygml_pull {{.CLI_ARGS}}'

  imagery:chips:
    desc: 'Sample training chips from the open COG catalog (R*Tree lookup, COG window reads, JPEG + JSONL manifest); CLI_ARGS="--bbox 5.20,52.07,5.25,52.115 --db /Volumes/gamma-systems-2/addr-imagery/open/catalog.db --out /Volumes/gamma-systems-2/addr-imagery/chips --size-m 512 --res-m 0.5"'
    cmds:
      - 'scripts/ml/training/.venv/bin/python -m scripts.ml.open_chips {{.CLI_ARGS}}'

  imagery:index-tiles:
    desc: 'Add an R*Tree spatial index and archive metadata to an XYZ tiles.db for bbox quick-fetch; CLI_ARGS="--db /Volumes/gamma-systems-2/addr-tiles/vicmap/tiles.db --provider vicmap --layer AERIAL_WM_256 --licence ..."'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.tile_index {{.CLI_ARGS}}'

  training:validate:
    desc: 'Outline-model training kit local validation: export 3 tiles, CPU smoke train, ONNX export, one-tile inference (scripts/ml/training/deploy/validate_local.sh); GPU run is deploy/run.sh'
    cmds:
      - scripts/ml/training/deploy/validate_local.sh

  eyes:heights:
    desc: 'Building heights (heights-v1): CLI_ARGS="--fetch" caches open sources (OSM, Microsoft footprints, ICESat-2; LiDAR only once licensed tiles sit in data/elevation/), "--from-cache", "--assign --suburb" writes rows; prior 3.2 m unless a trusted source exists'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.heights_source {{.CLI_ARGS | default "--from-cache --assign --suburb"}}'

  eyes:promote:
    desc: 'Inference-profile promotion (roof-promotion-v1): CLI_ARGS="--plan" | "--dry-run" | "--apply --i-understand-this-rewrites-latest-json" | "--rollback AUDIT"; refits roofs with the current fitter and hints, never SAM3; skips protected and human-decided scenes'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.promote_profile {{.CLI_ARGS | default "--plan"}}'

  training:distill:
    desc: 'City of Melbourne 2018 teacher only: runs ONE hires_teacher stage given in CLI_ARGS (extract|overview|select|crop|calibrate|teach|finalize|measure) and then distill_dataset for com-2018 (dataset-v1 format under distill-v1); run the stages in order and treat the distill step as meaningful only after finalize. Other sources: eyes:teacher-sources, training:teacher, training:teacher-dataset'
    cmds:
      - 'scripts/ml/training/.venv/bin/python -m scripts.ml.training.hires_teacher {{.CLI_ARGS}}'
      - '{{.PYTHON}} -m scripts.ml.training.distill_dataset'

  eyes:teacher-sources:
    desc: 'Teacher imagery registry and window cutter (teacher-sources-v1) for LINZ COG tiles, ArcGIS ImageServers (ACT), remote rasters (City of Melbourne 2020 2 cm at a 5 cm teacher pixel) and local orthomosaics: CLI_ARGS="list" | "catalog --source ID" | "select --source ID [--n 60 --bbox W S E N]" | "fetch --source ID" | "crop --source ID" | "register --source drone-ortho --path odm_orthophoto.tif"; then training:teacher'
    cmds:
      - 'scripts/ml/training/.venv/bin/python -m scripts.ml.training.teacher_sources {{.CLI_ARGS | default "list"}}'

  training:teacher:
    desc: 'Hi-res SAM3 teacher run for any registered source: CLI_ARGS="calibrate --source ID" | "teach --source ID [--shard K/N]" | "finalize --source ID" | "measure --source ID" (main venv, ONNX SAM3); windows come from eyes:teacher-sources crop'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.hires_teacher {{.CLI_ARGS}}'

  training:teacher-dataset:
    desc: 'dataset-v1 format export of a teacher run: CLI_ARGS="--source ID" (writes data/reviews/eyes/training/distill-<source>/)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.distill_dataset {{.CLI_ARGS}}'

  training:sam3-mac:fetch:
    desc: 'Download the gated facebook/sam3 checkpoint (3.45 GB) into scripts/ml/models/sam3-hf; needs `hf auth login` once or HF_TOKEN'
    cmds:
      - 'sh scripts/ml/training/sam3_mac/fetch_weights.sh'

  training:sam3-mac:coco:
    desc: 'SAM3 fine-tune COCO folders from dataset-v1 + distill-v1 (category renamed to the production prompt) under data/reviews/eyes/training/sam3-mac/coco-v1; CLI_ARGS adds more --dataset folders'
    cmds:
      - 'scripts/ml/training/.venv-sam3/bin/python -m scripts.ml.training.sam3_mac.prepare_coco --dataset data/reviews/eyes/training/dataset-v1 --dataset data/reviews/eyes/training/distill-v1 --out data/reviews/eyes/training/sam3-mac/coco-v1 {{.CLI_ARGS}}'

  training:sam3-mac:smoke:
    desc: 'SAM3 PyTorch checkpoint on MPS against the production int8 ONNX on the same saved tiles (agreement, seconds per image, contact sheet) -> data/reviews/eyes/training/sam3-mac/smoke; CLI_ARGS e.g. "--n 8 --dtype bf16"'
    cmds:
      - 'scripts/ml/training/.venv-sam3/bin/python -m scripts.ml.training.sam3_mac.smoke_infer {{.CLI_ARGS}}'

  training:sam3-mac:dry-run:
    desc: 'MPS operator coverage and step timing for the SAM3 fine-tune loop with random weights (no checkpoint needed): 3 steps at the native 1008 px (the ViT rotary tables are fixed at 1008)'
    cmds:
      - 'scripts/ml/training/.venv-sam3/bin/python -m scripts.ml.training.sam3_mac.finetune_mps --coco data/reviews/eyes/training/sam3-mac/coco-v1 --random-init --limit 8 --steps 3 --dry-run --out data/reviews/eyes/training/sam3-mac/run-dry {{.CLI_ARGS}}'

  training:sam3-mac:finetune:
    desc: 'Single-process SAM3 fine-tune on MPS (backbones frozen by default; writes run-001 unless --out is given): CLI_ARGS e.g. "--steps 300 --dtype bf16 --out data/reviews/eyes/training/sam3-mac/run-002"'
    cmds:
      - 'scripts/ml/training/.venv-sam3/bin/python -m scripts.ml.training.sam3_mac.finetune_mps --coco data/reviews/eyes/training/sam3-mac/coco-v1 --out data/reviews/eyes/training/sam3-mac/run-001 {{.CLI_ARGS}}'

  eyes:teacher-outlines:
    desc: 'Open building outlines (LINZ NZ Building Outlines, CC BY 4.0) for every selected window of a New Zealand teacher source, as a weak second opinion: CLI_ARGS="fetch --source linz-chc-2025-0075"'
    cmds:
      - 'scripts/ml/training/.venv/bin/python -m scripts.ml.training.teacher_outlines {{.CLI_ARGS | default "fetch --source linz-chc-2025-0075"}}'

  eyes:teacher-judges:
    desc: 'Independent judges of a teacher run (teacher-judges-v1), never accuracy: CLI_ARGS="outlines --source ID" (whole / part / unmatched against open outlines) | "edge-support --source ID" | "register --source A --other B" (image-only two-capture registration) | "ladder --source A --other B --cells train [--peak-tol-m 0.1]" (perturbation ladder, minimum detectable effect) | "boundary --source A --other B --cells judge --variants raw,ortho,ortho_gated" (J1 on the other capture) | "cross-capture --source A --other B" | "ledger --source A [--other B]" (per-instance evidence with a recorded keep / part / ignore / review recommendation, labels untouched); writes <teacher>/judges/'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.teacher_judges {{.CLI_ARGS}}'

  eyes:teacher-elevation:
    desc: 'LINZ 1 m nDSM (DSM minus DEM of the Christchurch 2024-2025 LiDAR, CC BY 4.0) as the second evidence leg of the teacher ledger (teacher-elevation-v1), agreement never accuracy: CLI_ARGS="catalog --source linz-chc-2025-0075 --epoch christchurch_2024-2025" (STAC tiles meeting the windows) | "fetch --source linz-chc-2025-0075 --epoch christchurch_2024-2025 --workers 8" (host job, jobgate 500 first; sha256-verified, resumable) | "measure --source linz-chc-2025-0075 --epoch christchurch_2024-2025" (host job, jobgate 2000 first; nDSM class, edge step, control discs outside every teacher polygon) | "judge --source linz-chc-2025-0075 --epoch christchurch_2024-2025 --cells judge" (class shares per recommendation, leave-one-signal-out, candidate ledger-policy-v2 rows); elevated surface present, never roof confirmed; writes data/elevation/linz-chc-1m/ and <teacher>/judges/ndsm_*, ledger_loso_*, ledger_v2_*; never ledger_rows.jsonl; the stages run in the training venv (rasterio), the unit tests only under the main venv (scripts/ml/.venv/bin/python -m pytest scripts/ml/tests/test_teacher_elevation.py)'
    cmds:
      - 'scripts/ml/training/.venv/bin/python -m scripts.ml.training.teacher_elevation {{.CLI_ARGS}}'

  eyes:teacher-checks:
    desc: 'Teacher-check: do the agent hints catch the reviewer themes? Fresh recompute over the feedback sets; sidecar report under data/reviews/eyes/teacher-checks; hints, never labels'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.teacher_checks {{.CLI_ARGS | default "--sets data/references/eyes-checkpoints/CP20/user-feedback-2026-09-30.json data/references/eyes-checkpoints/CP3/user-feedback-2026-09-26.json data/references/eyes-checkpoints/REVIEW-FEEDBACK-2026-09-28.json --require-all CP20"}}'

  training:sam3-mac:sweep:
    desc: 'Staged SAM3 fine-tune sweep on MPS, detached (sam3-mac-sweep-v1): CLI_ARGS="stage1" (learning-rate sweep 8e-5/3e-4/1e-3, raw teacher labels, 1500 steps, one seed) | "stage2 <lr>" (raw and squared-label arms, two seeds, 3000 steps). Each run is judged on the 63 human references with the novel-detection proxy; rows accumulate in data/reviews/eyes/training/sam3-mac/sweep/results.jsonl; sweep_next.py picks the stage-2 learning rate by a pre-registered rule'
    cmds:
      - 'nohup sh scripts/ml/training/sam3_mac/sweep.sh {{.CLI_ARGS | default "stage1"}} > data/reviews/eyes/training/sam3-mac/sweep/{{.CLI_ARGS | default "stage1"}}.log 2>&1 &'

  training:sam3-mac:reference-eval:
    desc: 'Judge SAM3 checkpoints on the human roof references of the dataset-v1 test split (63 boundary references, 44 tiles): CLI_ARGS="--arm base --arm tuned=<trainable.pt>"; reports matched share, best IoU, boundary distance, paired deltas and the novel-detection proxy; agreement, not accuracy'
    cmds:
      - 'scripts/ml/training/.venv-sam3/bin/python -m scripts.ml.training.sam3_mac.reference_eval {{.CLI_ARGS}}'

  training:sam3-mac:round3:
    desc: 'SAM3 teacher-loop round 3 waiter, detached (sam3-mac-round3-v1): CLI_ARGS="phase1" (ctrl, floor12, mixv2) | "phase2" (merge) | "reserve" (outline-f12) | "all". One fine-tune at a time (waits for any finetune_mps to end), bf16, MPS allocator capped, fold gate (0 train images over 200 annotations), loader gate, judge per block (dataset-v2 test primary, dataset-v1 continuity, dataset-v2 val for calibration), one row per arm in data/reviews/eyes/training/sam3-mac/round3/results.jsonl; re-running skips recorded arms and resumes interrupted fine-tunes. Prefix DRY_RUN=1 to print the plan without starting anything'
    cmds:
      - 'mkdir -p data/reviews/eyes/training/sam3-mac/round3 && nohup sh scripts/ml/training/sam3_mac/round3.sh {{.CLI_ARGS | default "phase1"}} >> data/reviews/eyes/training/sam3-mac/round3/round3.log 2>&1 &'

  training:sam3-mac:round3-report:
    desc: 'Render the round-3 ledger as a measurement-first markdown report (agreement, model estimate, reference; nothing promoted) -> data/reviews/eyes/training/sam3-mac/round3/REPORT.md; CLI_ARGS e.g. "--out docs/sam3-round3-report-2026-09-30.md"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.sam3_mac.round3_report {{.CLI_ARGS}}'

  eyes:small-roofs:
    desc: 'Live count of usable human small-roof decisions (sam3-mac-human-precision-v1, round 5) and the reviewer guide: production detections under 25 m2 on the judged dataset-v2 tiles that the reviewer confirmed (roof) or rejected (not roof) in the app or by chat transcription, joined to the frozen split; assistant-written reviews (until the reviewer''s own marked decision: notes that start [reviewer] roof or [reviewer] not a roof, with the marked class agreeing with the saved status (roof confirmed, not a roof rejected), saved after revision 1), machine labels and superseded objects are excluded. The only source of the number: run it at the moment a count is used, never type one. Default CLI_ARGS="count --json --block v2" (reads only; "count --block v2" prints text); "guide --block v2 --out MD --set JSON" regenerates the reviewer guide and review set from the same live count (writes only those two files). A share is read only at N >= 30 with >= 8 per class across >= 6 scenes; agreement between model estimates and the reviewer decisions, never accuracy'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.sam3_mac.r5_precision {{.CLI_ARGS | default "count --json --block v2"}}'

  training:sam3-mac:human-precision:
    desc: 'Round-5 human precision judge from recorded rows (sam3-mac-human-precision-v1; rules pre-registered in data/reviews/eyes/training/sam3-mac/round5/RULES.json): CLI_ARGS="count --json --block v2" (live count, reads only; also task eyes:small-roofs) | "guide --block v2 --out MD --set JSON" (reviewer guide and review set) | "rejudge --root data/reviews/eyes/training/sam3-mac/round3 --root data/reviews/eyes/training/sam3-mac/round4 --rules data/reviews/eyes/training/sam3-mac/round5/RULES.json --out data/reviews/eyes/training/sam3-mac/round5" (host job, jobgate 1000 first; block files, an append-only ledger and batches/ under round5/ only) | "report --ledger data/reviews/eyes/training/sam3-mac/round5/human-precision.jsonl --out data/reviews/eyes/training/sam3-mac/round5/HUMAN-PRECISION.md"; rows only, no inference, reference_eval.py unedited (its sha256 is the judge version), outputs under round5/ only; below N = 30 with 8 per class across 6 scenes it prints n/a and the per-object table; agreement between model estimates and the reviewer decisions, never accuracy; nothing is promoted'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.sam3_mac.r5_precision {{.CLI_ARGS}}'

  training:teacher-dataset-squared:
    desc: 'dataset-v1 format export of a teacher run with the squared-gated label target (raw where the gate refuses): CLI_ARGS="--source ID"; writes distill-<source>-squared/; add "--policy ledger-v1" to also ignore the ledger''s ignore class (writes -ledger)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.distill_dataset --label-target squared_gated {{.CLI_ARGS}}'

  recapture:plan:
    desc: 'Recapture carry path, dry run (recapture-plan-v1): one JSONL row per roof_training_250 cohort scene with the offline lot frame (frozen parcels only, never Vicmap; parcels_unavailable when nothing is frozen), the status tally per the DESIGN.json counting_rule (machine-only and agent-authored objects counted apart), human decisions, metre fields and the predicted post-carry status (every carried decision needs_adjustment, never confirmed, never rejected automatically); read-only over data/scenes, nothing captured, no network, no SAM3; writes data/reviews/eyes/recapture/plan-DATE.jsonl (DATE defaults to latest); a dated file is a frozen output and is never rewritten (plan-2026-09-30.jsonl is the pre-registered run the docs cite by sha): the task refuses a DATE whose file exists, and only plan-latest.jsonl is replaced, the new file naming the run it replaces in replaces_run; host job, jobgate 1500 first; counts are as computed at write time, never pinned'
    cmds:
      - 'd="{{.DATE | default "latest"}}"; [ "$d" = latest ] || [ ! -e "data/reviews/eyes/recapture/plan-$d.jsonl" ] || (echo "data/reviews/eyes/recapture/plan-$d.jsonl exists: a dated plan is never rewritten; choose a new DATE, or omit DATE to replace plan-latest.jsonl" && exit 1)'
      - '{{.PYTHON}} -m scripts.ml.scene_recapture plan --cohort roof_training_250 --offline --out data/reviews/eyes/recapture/plan-{{.DATE | default "latest"}}.jsonl'

  recapture:pilot:
    desc: 'Recapture carry path pilot on frame pairs that already exist (recapture-pilot-v1): the 8 cohort->house z20 pairs (model objects of the two frames only) plus every human-decided cohort scene inside a registered mooroolbark-* z19 frame; per pair the georeferenced frame_transform, the residual measured from both images (shift in metres, gradient NCC, overlap) against the pre-registered DESIGN.json, and IoU agreement of the re-projected outlines; agreement between two frames, never accuracy; z19 residuals do not transfer 1:1 to a z20 recapture; read-only over data/scenes, no network, no SAM3; writes data/reviews/eyes/recapture/pilot-DATE.json (DATE defaults to latest); a dated file is a frozen output and is never rewritten (pilot-2026-09-30.json is the pre-registered run the docs cite by sha): the task refuses a DATE whose file exists, and only pilot-latest.json is replaced, the new file naming the run it replaces in replaces_run; host job, jobgate 1500 first'
    cmds:
      - 'd="{{.DATE | default "latest"}}"; [ "$d" = latest ] || [ ! -e "data/reviews/eyes/recapture/pilot-$d.json" ] || (echo "data/reviews/eyes/recapture/pilot-$d.json exists: a dated pilot is never rewritten; choose a new DATE, or omit DATE to replace pilot-latest.json" && exit 1)'
      - '{{.PYTHON}} -m scripts.ml.scene_recapture pilot --pairs auto --out data/reviews/eyes/recapture/pilot-{{.DATE | default "latest"}}.json'

  recapture:capture:
    desc: 'Capture a NEW lot-<address_id> scene for ADDRESS and record its measured frame_transform against roof_training_250-ADDRESS (scene_lot --capture --carry-from): fetches imagery from the tile providers (and parcels from Vicmap when nothing frozen covers the lot); refuses and saves nothing (exit 1, "Recaptured frame does not agree with the source frame") when the frame fails DESIGN.json; never overwrites a scene and never writes an old latest.json or review.json (save_scene would recompute model_signature and stale the review), so the source scene stays live; runs no detector; carries nothing (the carry is the app wiring, not live yet); guarded: task recapture:capture ADDRESS=<address_id> CONFIRM=1; not run on 2026-09-30'
    cmds:
      - 'test "{{.CONFIRM}}" = "1" || (echo ''set CONFIRM=1'' && exit 1)'
      - '{{.PYTHON}} -m scripts.ml.scene_lot --address {{.ADDRESS}} --capture --carry-from roof_training_250-{{.ADDRESS}}'

  focus:plan:
    desc: 'Focus recapture plan for frame-cut targets (frame-cut-window-v1, scripts.ml.scene_focus): one subject-centred Google z20 window per house/lot (or per object plus body when no lot resolves), sized to the subject plus margin, 512 or 1024 px so the frame is never coarser than native z20; one JSONL row per window with centre, span, zoom, frame_px, m/px, lots and shares, bodies, grouping, covered_by_existing, uncarried_source, the PREDICTED overlap of every source frame as the SOURCE-pixel fraction and the eroded overlap REGION in target px, gated by DESIGN.json subject_recapture.min_overlap_px (overlap_gate ok / below_design; the min_overlap_fraction 0.6 is the same-address rule, recorded beside it and never gating a window), the DESIGN.json and WINDOW.json shas; identity lot-<address_id> only when no roof_training_250-<address_id> or house-<address_id> scene exists and no source in the window has that address (else win-<hash16>, flags address_reserved_for_scene / address_reserved_for_source, reserved_by); reads only (the registered index, frozen parcels, the read-only address index); with ONLINE=1 one bounded Vicmap read per unresolved window is frozen as a NEW file under data/reviews/eyes/parcels/, otherwise --offline; nothing captured, carried or counted; a dated OUT is never rewritten (the plan refuses an existing file): task focus:plan TARGETS=/tmp/frame-cut-targets.json DATE=YYYY-MM-DD [ONLINE=1]; writes data/reviews/eyes/recapture/window-plan-DATE.jsonl'
    cmds:
      - 'test -n "{{.TARGETS}}" || (echo ''set TARGETS=<json {scene_id: [object_id, ...]}>'' && exit 1)'
      - 'test -n "{{.DATE}}" || (echo ''set DATE=YYYY-MM-DD (a dated plan is never rewritten)'' && exit 1)'
      - '{{.PYTHON}} -m scripts.ml.scene_focus plan --targets {{.TARGETS}} {{if ne .ONLINE "1"}}--offline{{end}} --out data/reviews/eyes/recapture/window-plan-{{.DATE}}.jsonl'

  focus:capture:
    desc: 'Capture ONE planned focus window (scripts.ml.scene_focus capture): tiles only, no detector; records the measured frame_transform against the row''s carry_from (scene_recapture.measured_transform under DESIGN.json) and checks every slice and body sits inside with the 5 m edge margin; refuses and saves nothing (exit 1, "Recaptured frame does not agree with the source frame") when the plan row''s predicted overlap region is below DESIGN.json subject_recapture.min_overlap_px (overlap_gate below_design) or the measured frame_transform (role frame_cut_target: eroded overlap region side >= min_overlap_px, shift_m <= max_shift_m, ncc >= min_ncc; the min_overlap_fraction 0.6 is recorded, not gating) fails the design; never overwrites a scene (an existing window id is refused; the batch skips it) and never writes a source latest.json or review.json; carries nothing and writes no registry row (those are the carry step); guarded: task focus:capture PLAN=<window-plan-DATE.jsonl> WINDOW=<window_id> CONFIRM=1 [CACHE_ONLY=1] [SCRATCH_ID=qa_focus_...]'
    cmds:
      - 'test "{{.CONFIRM}}" = "1" || (echo ''set CONFIRM=1'' && exit 1)'
      - 'test -n "{{.PLAN}}" && test -n "{{.WINDOW}}" || (echo ''set PLAN=<plan jsonl> WINDOW=<window_id>'' && exit 1)'
      - '{{.PYTHON}} -m scripts.ml.scene_focus capture --plan {{.PLAN}} --window {{.WINDOW}} {{if eq .CACHE_ONLY "1"}}--cache-only{{end}} {{if .SCRATCH_ID}}--scratch-id {{.SCRATCH_ID}}{{end}}'

  focus:carry:
    desc: 'Target carry onto ONE captured focus window (scripts.ml.scene_focus carry; design 2026-10-01 section 4 A, runbook step 7): writes ONLY data/scenes/<window>/review.json at revision 1 (every frozen target of the window''s own source scene as the snapshot MODEL object projected through the measured frame_transform verified under DESIGN.json for role frame_cut_target (subject_recapture.min_overlap_px region floor, max_shift_m, min_ncc; never the 0.6 fraction); needs_adjustment, geometry_reviewed false, height_verified false, one bare lead sentence, carried_from with role frame_cut_target; no provenance / fieldwork_import / replaces) and appends one row per target to the dated registry data/reviews/eyes/recapture/windows-<UTC date>.jsonl (carried_source / uncarried_source, frame_transform_verified, the current DESIGN and WINDOW shas); a frozen key the counter already classifies roof / not_roof on its source is not carried (source decision wins); refuses by name and writes nothing on an unverified frame, a moved DESIGN.json, a snapshot mismatch or a key already registered to another window; an existing review.json is skipped (exit 3); never writes a source scene; guarded: task focus:carry WINDOW=<window_id> CONFIRM=1 [REGISTRY=<jsonl>]'
    cmds:
      - 'test "{{.CONFIRM}}" = "1" || (echo ''set CONFIRM=1'' && exit 1)'
      - 'test -n "{{.WINDOW}}" || (echo ''set WINDOW=<window_id>'' && exit 1)'
      - '{{.PYTHON}} -m scripts.ml.scene_focus carry --scene {{.WINDOW}} {{if .REGISTRY}}--registry {{.REGISTRY}}{{end}}'

  focus:takeover:
    desc: 'Takeover of carried frame-cut slices by the whole-roof detection of the window''s own model (scripts.ml.scene_focus takeover; reviewer direction 2026-10-02 "the orange bounding box cuts off so the object boundary looks bad"; TAKEOVER rule pre-registered as the WINDOW.json dated amendment takeover_rule): a carried copy C (carried_from, needs_adjustment) is taken over by building detection D of latest.json when D is the single detection covering >= 0.8 of C''s area (shapely intersection / C area), D''s ring lies wholly inside the frame (no vertex within 1 px of an edge) and no other detection covers C at >= 0.5; then C.status superseded, C.replacement_ids [D], C keeps carried_from and every other field, D.replaces = D.derived_from = the sorted copy ids (the app''s save validator needs the reciprocal), D stays candidate; copies below the cover, shared by two detections, whose detection touches the frame or is not a review candidate are left alone with the reason (the reviewer decides the slice on the image); nothing becomes confirmed or rejected. Dry run by default: prints per window the planned copy -> detection pairs with coverage and the left-alone copies with reasons, plus tallies; writes nothing. CONFIRM=1 writes ONLY data/scenes/<window>/review.json while it is revision 1 by the carry / carry-forward and names latest.json''s model_signature, under review.lock, temp + replace, revision 1 kept, updated_by scripts.ml.scene_focus takeover, every other byte identical, and appends one row per window (role takeover: pairs, left_alone, previous/new review sha256, at) to the dated registry data/reviews/eyes/recapture/windows-<UTC date>.jsonl; refuses by name and writes nothing otherwise (a saved review, a foreign author, a model mismatch, a locked scene); never latest.json, models, images or a source scene: task focus:takeover WINDOW=<window_id> | ALL=1 [CONFIRM=1] [REGISTRY=<jsonl>]'
    cmds:
      - 'test -n "{{.WINDOW}}" -o "{{.ALL}}" = "1" || (echo ''set WINDOW=<window_id> or ALL=1'' && exit 1)'
      - '{{.PYTHON}} -m scripts.ml.scene_focus takeover {{if eq .ALL "1"}}--all{{else}}--scene {{.WINDOW}}{{end}} {{if eq .CONFIRM "1"}}--write{{end}} {{if .REGISTRY}}--registry {{.REGISTRY}}{{end}}'

  focus:ready:
    desc: 'Render-and-look readiness gate, the LAST step of the window pipeline (scripts.ml.scene_window_ready, window-readiness-v1; decision card 2026-10-06 item 4, reviewer "yes to defaults": no window link reaches the reviewer until its render shows the asked object as a whole roof): after takeover / body carry and before the link enters the worklist, renders the window frame at native resolution with the asked objects (carried frame-cut slices and their replacers) outlined, the model-layer buildings thin and the frame edge marked, and decides READY / NOT READY with reasons: slice_only (the asked object for a frozen key is an undecided carried frame_cut_target slice with no replacer; a reviewer-decided slice stands), model_empty (latest.json has no building object and no carried whole_roof_body replaces the slice), ring_on_frame (an asked ring has a vertex within 1 px of the frame, the TAKEOVER tolerance, or beyond it); a stale review is recorded, never a refusal; a refused window is listed "not ready" with its reasons and render path; writes ONLY the renders + verdicts under OUT (one window; exit 1 when not ready) or, with ALL=1, data/reviews/eyes/recapture/window-readiness-<UTC date>/ plus the report pair window-readiness-<UTC date>.{json,md} (one line per window; an existing dated report is refused unless OVERWRITE=1; DATE=YYYY-MM-DD names the session date when it differs from UTC, STEM=<path> another name); never a scene, the registry, RULES / WINDOW / DESIGN; no inference, no browser: task focus:ready WINDOW=<window_id> [OUT=<dir>] | ALL=1 [DATE=YYYY-MM-DD] [STEM=<stem>] [OVERWRITE=1]'
    cmds:
      - 'test -n "{{.WINDOW}}" -o "{{.ALL}}" = "1" || (echo ''set WINDOW=<window_id> or ALL=1'' && exit 1)'
      - '{{.PYTHON}} -m scripts.ml.scene_window_ready {{if eq .ALL "1"}}--all{{else}}--scene {{.WINDOW}}{{end}} {{if .OUT}}--out {{.OUT}}{{end}} {{if .STEM}}--stem {{.STEM}}{{end}} {{if .DATE}}--date {{.DATE}}{{end}} {{if eq .OVERWRITE "1"}}--overwrite{{end}}'

  verify:scene-reject:
    desc: 'Headless check of the quick reject and one-key relabel in the scene editor (Not a roof + Backspace, chips 1-9/0); read-only, needs a fresh build'
    cmds:
      - 'APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-scene-reject.mjs'

  verify:scene-edit-flow:
    desc: 'Headless check of the post-edit save flow, keyboard and handle sizing on a scratch scene (qa_editflow_*, removed afterwards); needs a fresh build'
    cmds:
      - 'APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-scene-edit-flow.mjs'

  verify:frame-clip:
    desc: 'Headless check that a widened house scene shows the frame-cut note on carried seeds and no clipped ghost outline survives in the edited layer (house-25822); read-only'
    cmds:
      - 'APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-frame-clip.mjs'

  verify:scene-recapture:
    desc: 'Headless check of the recapture carry on scratch qa_recap_src_* / qa_recap_dst_* copies (a cohort scene with its review and the registered frame it sits in, with a measured and verified frame_transform): the banner names the re-projection, no carried object comes back confirmed or rejected, Carry edits forward writes only the scratch scene, metre fields are translated by metre_offset; scratch folders removed afterwards and real scenes re-hashed; needs the deferred app wiring (not live on 2026-09-30) and is not run while the host is memory-starved (it refuses a closed jobgate)'
    cmds:
      - 'APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-scene-recapture.mjs'

  web:rebuild:
    desc: 'Rebuild the production web bundle safely: pauses the MPS fine-tune, refuses to run beside scene extraction, restarts the launchd service only on success'
    cmds:
      - 'sh scripts/rebuild-web.sh'
