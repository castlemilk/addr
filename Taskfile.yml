  pull:
    aliases: [feedback:pull]
    desc: Sync Fieldwork feedback into local scene reviews
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fieldwork_feedback pull {{.CLI_ARGS}}'

  feedback:preview:
    desc: Preview a saved Fieldwork packet against current local scenes
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fieldwork_feedback preview {{.CLI_ARGS}}'

  feedback:apply:
    desc: Apply Fieldwork feedback using the explicit preview plan ID
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fieldwork_feedback apply {{.CLI_ARGS}}'

  push:
    desc: 'Publish changed local scene frames/reviews to Fieldwork as new immutable items (model estimate + local review state as of publication; never edits Fieldwork overrides): syncs the mirror, plans, applies the clean part, reports blocked/too_large/invalid_frame scenes. "-- --dry-run" plans only (ListChanges/GetItem/GetInfo/HEAD); "-- --run ID" resumes a saved plan; "-- --url U --dir D" targets a local dev server; live origin refuses non-dry-run without FIELDWORK_PUSH_ALLOW_LIVE=1. See docs/annotation/local-to-fieldwork.md'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fieldwork_push push {{.CLI_ARGS}}'

  push:status:
    desc: 'Show push receipts for the Fieldwork mirror (latest generation item per scene, marks, run ids); reads data/fieldwork-sync/<project>/push/ only, no network'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fieldwork_push status {{.CLI_ARGS}}'
  fieldwork:review:stage:
    desc: 'Stage the 8 Oct review queue for Fieldwork (shadows, cuts, vegetation types, joins, round 5): re-checks every proposal against data/scenes (read-only), crops the scene images, writes a frozen bundle under .run/fieldwork-review/review-2026-10-08/. "-- --drop-stale" leaves out lines whose object changed (listed). No network.'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fieldwork_review stage {{.CLI_ARGS}}'
  fieldwork:review:push:
    desc: 'Create the staged review items in the separate Fieldwork project mooroolbark-review (never mooroolbark): assets, project, labels, items at revision 0 only; reruns skip by receipt; an existing id with other content is stopped, never overwritten. Receipts in data/fieldwork-sync/mooroolbark-review/review/. "-- --dry-run" probes only; "-- --limit 1" is the canary; "-- --url U --dir D" targets a local dev server; the live origin needs FIELDWORK_PUSH_ALLOW_LIVE=1.'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fieldwork_review push {{.CLI_ARGS}}'
  fieldwork:review:pull:
    desc: 'Read the reviewer clicks in mooroolbark-review back (read-only on Fieldwork) into answer lines, decisions, preview requests, veg-type-decisions (record-chat-feedback format, source human:fieldwork) and joins decisions under data/reviews/eyes/experiments/review-2026-10-08/fieldwork/. Shadow / cut / join items also read the item Review status (Approved = right, Rejected = wrong); when it disagrees with the PROPOSED outline nothing is recorded and the item is listed under conflicts. Right from the answer bar (confirmed with Geometry reviewed) on PROPOSED / JOINED, or on a vegetation outline, is read as right, not as a flag. A vegetation type (Label word or vegetation_type) next to Wrong or Not sure is a conflict; a type on a shadow / cut / join outline is listed under not_stored. A vegetation item status alone is listed under needs_words; every changed item nothing was read from is listed under unread. Records the change actor. Never writes data/scenes or Fieldwork. Agent assessments are exported separately as agent-reviews-*.json; only SaveAgentReview may append agent assessments in a -review project.'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fieldwork_review pull {{.CLI_ARGS}}'
  fieldwork:review:status:
    desc: 'Review-queue receipts per family and the last pull summary, with its conflicts, needs_words and unread lists; no network'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fieldwork_review status {{.CLI_ARGS}}'

