version: '3'

includes:
  rooftam: ./Taskfile.rooftam.yml

dotenv: ['.env.local', '.env']

vars:
  RUN_DIR: .run
  SERVER_PORT: '{{.SERVER_PORT | default "8085"}}'
  WEB_PORT: '{{.WEB_PORT | default "3008"}}'
  ML_PORT: '{{.ML_PORT | default "8090"}}'
  DB_PATH: '{{.DB_PATH | default "data/australia_geo.db"}}'
  TILES_PATH: '{{.TILES_PATH | default "data/australia_tiles.mbtiles"}}'
  GO_BIN: bin/geoserver
  VENV: scripts/ml/.venv
  PYTHON: scripts/ml/.venv/bin/python
  ML_ARGS: ''

tasks:
  scene:suburb:
    desc: Prepare or resume the frozen full-Mooroolbark roof, tree and solar inference run
    cmds:
      - '{{.PYTHON}} -m scripts.ml.scene_suburb {{.CLI_ARGS}}'

  scene:confidence:
    desc: Assess model evidence for scene IDs or calibrate reviewed validation areas
    cmds:
      - '{{.PYTHON}} -m scripts.ml.scene_confidence {{.CLI_ARGS}}'

  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install all dependencies (Go modules, Node packages, Python venv)
    cmds:
      - go mod download
      - pnpm install
      - task: setup:ml

  setup:ml:
    desc: Create the Python venv and install ML pipeline dependencies
    cmds:
      - uv venv --python 3.12 {{.VENV}}
      - uv pip install --python {{.PYTHON}} -r scripts/ml/requirements-dev.txt

  generate:
    desc: Lint protobufs and regenerate Go + TypeScript clients
    cmds:
      - buf lint
      - buf generate

  build:
    desc: Build the Go service and the Next.js production bundle
    cmds:
      - task: build:server
      - task: build:web

  build:server:
    desc: Build the Go microservice binary into bin/geoserver
    sources:
      - cmd/**/*.go
      - internal/**/*.go
      - gen/**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.GO_BIN}}'
    cmds:
      - go build -trimpath -o {{.GO_BIN}} ./cmd/server

  build:web:
    desc: Build the Next.js production bundle
    sources:
      - .env*
      - src/**/*
      - public/**/*
      - package.json
      - next.config.ts
      - tsconfig.json
      - postcss.config.mjs
    generates:
      - .next/BUILD_ID
    env:
      NEXT_PUBLIC_GEO_SERVICE_URL: '{{.NEXT_PUBLIC_GEO_SERVICE_URL | default "http://localhost:8085"}}'
    cmds:
      - pnpm build

  test:
    desc: Run the Go, Python, and TypeScript test/check suites
    cmds:
      - task: test:go
      - task: test:ml
      - task: typecheck
      - task: test:reviews

  test:reviews:
    desc: Verify review validation, atomic feedback storage, and stale-save protection
    cmds:
      - node scripts/test-reviews.mjs
      - node scripts/test-roof-geometry.mjs
      - node scripts/test-scene-geometry.mjs
      - node scripts/test-shade-sail.mjs
      - node scripts/test-property-parcels.mjs
      - node scripts/test-scene-feedback.mjs
      - node --test src/lib/annotations/feedback.test.mjs
      - node --test src/lib/annotations/addr-scene.test.mjs
      - node --test src/lib/annotations/agent-reviews.test.mjs
      - node --test src/lib/annotations/queue.test.mjs
      - node --test src/lib/annotations/api.test.mjs
      - node --test src/lib/annotations/drafts.test.mjs
      - node scripts/test-scene-groups.mjs
      - node scripts/test-scene-queue.mjs
      - node scripts/test-candidate-checks.mjs
      - node scripts/test-scene-roof-runs.mjs
      - node scripts/test-roof-line-edits.mjs
      - node scripts/test-roof-feedback-patch.mjs
      - node scripts/test-roof-observations-route.mjs
      - node scripts/test-self-review-start.mjs
      - node scripts/test-processing-poll.mjs
      - node scripts/test-workbench-nav.mjs
      - node scripts/test-shell-adoption.mjs
      - node scripts/test-shell-pages.mjs
      - node scripts/test-sidebar-copy.mjs
      - node scripts/test-recent-scenes.mjs
      - node scripts/test-scene-start.mjs
      - node scripts/test-processing-slice.mjs
      - node scripts/test-processing-workspace.mjs
      - node scripts/test-queues.mjs
      - node scripts/test-queues-route.mjs
      - node scripts/test-markdown-lite.mjs
      - node scripts/test-queues-ui.mjs
      - node scripts/test-eyes-route.mjs
      - node scripts/test-scene-image-route.mjs
      - node scripts/test-scene-stacks-route.mjs
      - node scripts/test-scene-hints-route.mjs
      - node scripts/test-outline-hints.mjs
      - node scripts/test-scene-frame-filter.mjs
      - node scripts/test-scene-lots-route.mjs
      - node scripts/test-scene-lot-scope.mjs
      - node scripts/test-address-enrichment.mjs
      - node scripts/test-scene-recapture.mjs
      - node scripts/test-scene-recapture-wiring.mjs
      - node scripts/test-scene-types-gaps.mjs
      - node scripts/test-scene-initial-view.mjs
      - node scripts/test-scene-paint-order.mjs
      - node scripts/test-scene-vegetation-type.mjs

  test:go:
    desc: Run Go unit and integration tests
    cmds:
      - go test ./...

  test:ml:
    desc: Run the Python ML pipeline and server tests
    cmds:
      - '{{.PYTHON}} -m pytest scripts/ml/tests -q'

  typecheck:
    desc: Typecheck the frontend with tsc
    cmds:
      - pnpm exec tsc --noEmit

  verify:ui:
    desc: Headless Chrome smoke test of the map, roof meshes, and Deep 3D Studio
    cmds:
      - APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-map.mjs

  verify:shell:
    desc: App shell on reviews, training, candidates, capture and imagery dates (one nav, one h1, aria-current, no caps, titles)
    cmds:
      - APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-shell.mjs

  verify:map-shell:
    desc: Verify the light map shell (workspace nav row, single address h1, Geist, native layer checkboxes, ?crm=1)
    cmds:
      - APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-map-shell.mjs

  verify:scene-start:
    desc: Verify the /scenes hub, recent scenes, editor header nav and draft-guarded navigation
    cmds:
      - APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-scene-start.mjs

  verify:processing:
    desc: Verify the processing workspace paints from the summary, pages roofs server-side, shows the three eyes groups and never sends a response over 2 MB
    cmds:
      - APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-processing.mjs

  verify:queues:
    desc: Verify the Review queues hub and checkpoint reports are read-only, link into the editor and fit a phone
    cmds:
      - APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/verify-queues.mjs

  ui:shots:
    desc: 'Screenshot every page at desktop and key pages at mobile into OUT_DIR (default /tmp/addr-eyes/ui)'
    cmds:
      - APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/ui-shots.mjs

  verify:reviews:
    desc: Verify the roof review UI and isolated feedback API round-trip
    cmds:
      - APP_URL="http://localhost:{{.WEB_PORT}}/reviews" node scripts/verify-reviews.mjs
      - APP_URL="http://localhost:{{.WEB_PORT}}" node scripts/test-review-api.mjs

  verify:quality:
    desc: 'Quality gate over the latest perf/isolation reports (fails on regression)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.quality_gate {{.CLI_ARGS}}'

  training:export:
    desc: 'Export CRM corrections (before/after geometry) as a training reference dataset'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.export_training --db {{.DB_PATH}} --records public/address-roofs.json --out data/training/corrections.jsonl {{.CLI_ARGS}}'

  training:prepare:
    desc: Export versioned reviewed roof/graph/object labels and evaluate retraining readiness
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training_dataset {{.CLI_ARGS}}'
      - '{{.PYTHON}} -m scripts.ml.train_roof_form {{.CLI_ARGS}}'

  training:cohort:
    desc: Select 250 distinct roofs with spatial holdout groups
    cmds:
      - '{{.PYTHON}} -m scripts.ml.build_review_set {{.CLI_ARGS}}'

  roof:objects:
    desc: Detect solar arrays and skylights as reviewable SAM3 proposals
    cmds:
      - '{{.PYTHON}} -m scripts.ml.roof_objects {{.CLI_ARGS}}'

  review:corrections:
    desc: 'Contact sheet of CRM-corrected addresses (before/after review)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.performance_report --tiles {{.TILES_PATH}} --records public/address-roofs.json --out data/reviews/performance.json --sheet data/reviews/corrections-sheet.png --crm-only --sheet-count 9 {{.CLI_ARGS}}'

  roof:cohort:
    desc: 'Batch evaluate a roof review cohort and render a contact sheet'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.roof_cohort --records public/address-roofs.json {{.CLI_ARGS}}'


  eyes:guard:
    desc: 'Verify protected references, frozen run, CRM roof override and confidence index are unchanged (exit 1 on drift)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.eyes_guard {{.CLI_ARGS}}'

  eyes:registry:
    desc: 'Build the tiered human-reference registry (T1 confirmed, T2 human edits, T3 agent observations, T4 context) into data/reviews/eyes'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.reference_registry --build --summary {{.CLI_ARGS}}'

  eyes:cluster:
    desc: 'Compute CP1 sidecar signals for the 27 Cambridge cluster: agreement, cross-capture, roof diagnostics, object quality, shadow bands'
    vars:
      SCENES: mooroolbark-50011498-17-118442-80417 house-30286 house-30296
    cmds:
      - '{{.PYTHON}} -m scripts.ml.reference_agreement --build --tiers T1 T2 --scene-ids roof_training_250-29790 --summary'
      - '{{.PYTHON}} -m scripts.ml.reference_agreement --build --bounds 145.3105 -37.7925 145.3145 -37.7885 --scene-ids roof_training_250-29790'
      - '{{.PYTHON}} -m scripts.ml.cross_capture --build --summary'
      - '{{.PYTHON}} -m scripts.ml.scene_roof_diagnostics --scenes {{.SCENES}} --include-unowned --workers 3'
      - '{{.PYTHON}} -m scripts.ml.scene_object_quality --scenes {{.SCENES}} --rates'
      - '{{.PYTHON}} -m scripts.ml.shadow_bands --scenes {{.SCENES}} --flip-matrix'

  eyes:snapshot:
    desc: 'Write a content-addressed suburb snapshot of all eyes signals with denominators (or --diff A B)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.eyes_report {{.CLI_ARGS | default "--snapshot"}}'

  eyes:calibration:
    desc: 'Fixed-hash sampled-roof calibration plan and review queue (default --plan), or CLI_ARGS="--progress PLAN_ID" for Wilson progress'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.reference_calibration {{.CLI_ARGS | default "--plan"}}'

  eyes:eligibility:
    desc: 'Count low-band roofs reachable by the review loop under the frame vs core split policies'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.eyes_eligibility --count {{.CLI_ARGS}}'

  eyes:stack:
    desc: 'Register Esri Wayback dates onto the saved scene grid and build stack statistics/edge consensus, e.g. CLI_ARGS="mooroolbark-50011498-17-118442-80417"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.scene_stack {{.CLI_ARGS}}'

  eyes:multidate:
    desc: 'Detector-free multi-date agreement rows for one scene, e.g. CLI_ARGS="--scene ID --stack STACK_OR_RUN_ID"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.multidate_agreement {{.CLI_ARGS}}'

  eyes:experiment:
    desc: 'Paired isolated experiments with claims/cannot_claim, e.g. CLI_ARGS="--band-v2" | "--split-policy" | "--summarise-isolated DIR" | "--plan EXP --scenes ..."'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.eyes_experiments {{.CLI_ARGS}}'

  eyes:checkpoint:
    desc: 'Publish a checkpoint to the CRM (POI + address tags/notes) from data/reviews/eyes/checkpoints/<ID>.json, e.g. CLI_ARGS="--id CP1 --dry-run"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.crm_checkpoint {{.CLI_ARGS}}'

  eyes:edit-diffs:
    desc: 'Per-object diff of the model outline vs the reviewer outline for every human-tier edit (vertex counts, IoU, area before/after, symmetric boundary distance median/p90 in metres, rejected flag); agreement between the model outline and the reviewer outline, not accuracy; read-only over data/scenes, writes data/reviews/eyes/edit-diffs/<UTC date>/'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.review_edit_diffs {{.CLI_ARGS}}'

  eyes:line-corrections:
    desc: "Reviewer roof-line corrections vs the model's starting estimate (roof_line_edits.baseline), one row per saved review revision: repo line rule 0.5 m/10 deg, distance sweep, 1 m length coverage shares, graph topology on both sides; agreement between the model estimate and the reviewer's lines, never accuracy (a draft while ref_checked is false); read-only over data/scenes, writes eyes.sqlite line_corrections + data/reviews/eyes/line-corrections/<UTC date>/; e.g. task eyes:line-corrections -- --objects house-25822:4fa078ff5ac6a8d4 (use --dry-run via the module to preview without writing)"
    cmds:
      - '{{.PYTHON}} -m scripts.ml.line_corrections --build --summary {{.CLI_ARGS}}'

  training:edit-diff:
    desc: 'Per-object diff of the model estimate vs the reviewer outline (IoU, Hausdorff, vertex delta, holes, edit revision); agreement, not accuracy; read-only over data/scenes, writes data/reviews/eyes/training/edit-diff/'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.edit_diff --summary {{.CLI_ARGS}}'

  training:publish:
    desc: 'Stage selected training artefacts (dataset-vN, edit-diffs/<date>, line-corrections/<date>, edit-diff, sweep, coco-v1, eyes as VACUUM INTO) into a content-addressed bundle and publish one immutable addr-report manifest item to the addr-training Fieldwork project; dry-run unless "-- --apply"; "-- --url U --token-file T" targets a server; live origin refuses --apply without FIELDWORK_PUSH_ALLOW_LIVE=1; no training is started. See docs/annotation/local-to-fieldwork.md'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.publish_artefacts {{.CLI_ARGS}}'

  training:manifests:
    desc: 'List published training manifests (addr-training project, addr-report items): item id, manifest sha, publishedAt, groups, bytes; read-only'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.pull_artefacts list {{.CLI_ARGS}}'

  training:pull:
    desc: 'Pull one training manifest (--manifest ID_OR_SHA | --latest) into --out DIR with per-chunk and whole-file sha verification, optional --only groups, --with-scenes (needs the eyes group) and --resume; consumers (export_dataset, prepare_coco --copy, edit_diff) run unchanged on the pulled root'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.training.pull_artefacts pull {{.CLI_ARGS}}'

  lint:
    desc: Lint Go, TypeScript, and Python sources
    cmds:
      - go vet ./...
      - pnpm lint
      - '{{.PYTHON}} -m ruff check scripts/ml'

  start:
    desc: Start ML generator, Go service, and web UI in the background
    cmds:
      - task: start:ml
      - task: start:server
      - task: start:web
      - task: status

  start:server:
    desc: Start the Go microservice in the background
    deps: [build:server]
    cmds:
      - mkdir -p {{.RUN_DIR}}
      - |
        if [ -f {{.RUN_DIR}}/server.pid ] && ps -p "$(cat {{.RUN_DIR}}/server.pid)" > /dev/null 2>&1; then
          echo "Go service already running (pid $(cat {{.RUN_DIR}}/server.pid))"
        else
          TILE_GENERATOR_URL="${TILE_GENERATOR_URL:-http://127.0.0.1:{{.ML_PORT}}}" \
            nohup sh -c 'echo $$ > {{.RUN_DIR}}/server.pid; exec {{.GO_BIN}} -port {{.SERVER_PORT}} -db {{.DB_PATH}} -tiles {{.TILES_PATH}} -crm-noauth' \
            > {{.RUN_DIR}}/server.log 2>&1 &
          sleep 1
          echo "started Go service on :{{.SERVER_PORT}} (pid $(cat {{.RUN_DIR}}/server.pid 2>/dev/null || echo '?'))"
        fi

  start:ml:
    desc: Start the realtime ML tile generator in the background
    cmds:
      - mkdir -p {{.RUN_DIR}}
      - |
        if [ ! -x {{.PYTHON}} ]; then
          echo "Python venv missing at {{.PYTHON}}; run 'task setup:ml'"; exit 1
        fi
        if [ -f {{.RUN_DIR}}/ml.pid ] && ps -p "$(cat {{.RUN_DIR}}/ml.pid)" > /dev/null 2>&1; then
          echo "ML generator already running (pid $(cat {{.RUN_DIR}}/ml.pid))"
        else
          nohup sh -c 'echo $$ > {{.RUN_DIR}}/ml.pid; exec {{.PYTHON}} -m scripts.ml.server --port {{.ML_PORT}} --heights {{.ML_ARGS}}' \
            > {{.RUN_DIR}}/ml.log 2>&1 &
          sleep 1
          echo "started ML generator on :{{.ML_PORT}} (pid $(cat {{.RUN_DIR}}/ml.pid 2>/dev/null || echo '?'))"
        fi

  start:web:
    desc: Start the production Next.js server in the background
    deps: [build:web]
    cmds:
      - mkdir -p {{.RUN_DIR}}
      - |
        if [ -f {{.RUN_DIR}}/web.pid ] && ps -p "$(cat {{.RUN_DIR}}/web.pid)" > /dev/null 2>&1; then
          echo "web already running (pid $(cat {{.RUN_DIR}}/web.pid))"
        else
          nohup sh -c 'echo $$ > {{.RUN_DIR}}/web.pid; exec ./node_modules/.bin/next start -p {{.WEB_PORT}}' \
            > {{.RUN_DIR}}/web.log 2>&1 &
          sleep 1
          echo "started web UI on :{{.WEB_PORT}} (pid $(cat {{.RUN_DIR}}/web.pid 2>/dev/null || echo '?'))"
        fi

  dev:
    desc: Start ML generator and Go service in background, Next.js dev server in foreground
    cmds:
      - task: start:ml
      - task: start:server
      - pnpm exec next dev -p {{.WEB_PORT}}

  stop:
    desc: Stop all background services started by task start
    cmds:
      - |
        for svc in web ml server; do
          pidfile={{.RUN_DIR}}/$svc.pid
          if [ -f "$pidfile" ]; then
            pid=$(cat "$pidfile")
            if ps -p "$pid" > /dev/null 2>&1; then
              sh -c "kill $pid" 2>/dev/null || true
              echo "stopped $svc (pid $pid)"
            else
              echo "$svc was not running"
            fi
            rm -f "$pidfile"
          fi
        done
      - pkill -f "next-server" 2>/dev/null || true

  restart:
    desc: Stop and start all services
    cmds:
      - task: stop
      - task: start

  status:
    desc: Show background service status and health endpoints
    silent: true
    cmds:
      - |
        for svc in server ml web; do
          pidfile={{.RUN_DIR}}/$svc.pid
          if [ -f "$pidfile" ] && ps -p "$(cat "$pidfile")" > /dev/null 2>&1; then
            echo "[up]   $svc (pid $(cat "$pidfile"))"
          else
            echo "[down] $svc"
          fi
        done
      - 'curl -fsS --max-time 2 http://localhost:{{.SERVER_PORT}}/healthz > /dev/null 2>&1 && echo "[ok]   geo service :{{.SERVER_PORT}}" || echo "[fail] geo service :{{.SERVER_PORT}}"'
      - 'curl -fsS --max-time 2 http://localhost:{{.ML_PORT}}/healthz > /dev/null 2>&1 && echo "[ok]   ml generator :{{.ML_PORT}}" || echo "[fail] ml generator :{{.ML_PORT}}"'
      - 'curl -fsS --max-time 2 -o /dev/null http://localhost:{{.WEB_PORT}} 2>/dev/null && echo "[ok]   web ui :{{.WEB_PORT}}" || echo "[fail] web ui :{{.WEB_PORT}}"'

  logs:
    desc: Tail background service logs
    cmds:
      - tail -n 50 -f {{.RUN_DIR}}/*.log

  ml:
    desc: Run the realtime tile generator in the foreground
    cmds:
      - '{{.PYTHON}} -m scripts.ml.server --port {{.ML_PORT}} --heights {{.ML_ARGS}}'

  models:
    desc: Download ONNX models (CLI_ARGS="--presets hot-buildings --quantized")
    cmds:
      - '{{.PYTHON}} -m scripts.ml.fetch_models {{.CLI_ARGS}}'

  tiles:
    desc: 'Build building tiles, e.g. task tiles -- --bbox 145.308,-37.797,145.320,-37.786 --zooms 16 --heights'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.pipeline {{.CLI_ARGS}}'

  refine:
    desc: 'Cross-tile canopy/building conflict refinement of the archive (auto-run by tiles --trees)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.refine_conflicts --in {{.TILES_PATH}} --out data/australia_tiles_refined.mbtiles {{.CLI_ARGS}}'

  addresses:
    desc: 'Extract per-address roof records, e.g. task addresses -- --bbox 145.308,-37.797,145.320,-37.786'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.addresses --tiles {{.TILES_PATH}} --db {{.DB_PATH}} --bbox "{{.BBOX | default "145.308,-37.797,145.320,-37.786"}}" --out public/address-roofs.json --format json {{.CLI_ARGS}}'

  review:address:
    desc: 'Metadata + site/3D review renders, e.g. task review:address -- --address "27 CAMBRIDGE ROAD"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.address_review {{.CLI_ARGS}}'

  perf:
    desc: 'Performance dashboard: quality grades, isolation, coverage, worst-address contact sheet'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.performance_report --tiles {{.TILES_PATH}} --records public/address-roofs.json --out data/reviews/performance.json --sheet data/reviews/performance-sheet.png {{.CLI_ARGS}}'

  isolation:
    desc: 'Isolation report (roof/tree/obstacle conflicts) + diagnostic map'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.isolation --tiles {{.TILES_PATH}} --records public/address-roofs.json --out data/reviews/isolation.json --map data/reviews/isolation.png {{.CLI_ARGS}}'

  attribution:
    desc: 'Attribution audit: records whose ring fits another pin better than its own'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.attribution --records public/address-roofs.json --db {{.DB_PATH}} --out data/reviews/attribution.json {{.CLI_ARGS}}'

  studio:check:
    desc: 'Validate the Deep 3D Studio mesh for an address, e.g. task studio:check -- --address-id 29790 --expect concave'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.studio_check --records public/address-roofs.json {{.CLI_ARGS}}'

  rooflines:
    desc: 'TU Delft-style rooflines for one address (kinetic-partition port), e.g. task rooflines -- --address-id 29790'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.rooflines --records public/address-roofs.json {{.CLI_ARGS}}'

  silhouette:
    desc: 'Snap one address ring to image edges (opt-in review), e.g. task silhouette CLI_ARGS="--address-id 25008 --debug data/reviews/snap.png"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.silhouette --records public/address-roofs.json {{.CLI_ARGS}}'

  crm:user:
    desc: 'Create a CRM user, e.g. task crm:user -- --name alice --roles admin (viewer|editor|admin)'
    cmds:
      - 'go run ./cmd/crmctl create-user {{.CLI_ARGS}}'

  crm:key:
    desc: 'Mint a CRM API key (printed once), e.g. task crm:key -- --user alice --label laptop'
    cmds:
      - 'go run ./cmd/crmctl create-key {{.CLI_ARGS}}'

  crm:list:
    desc: 'List CRM users and API keys'
    cmds:
      - 'go run ./cmd/crmctl list-users'
      - 'go run ./cmd/crmctl list-keys'

  sam3:review:
    desc: 'Run SAM3 separately and write review previews/GeoJSON, e.g. task sam3:review -- --bbox 145.310669,-37.792422,145.316162,-37.788081 --zooms 16 --limit-tiles 1'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.sam3_review --existing {{.TILES_PATH}} {{.CLI_ARGS}}'

  clean:
    desc: Remove build artifacts and runtime state
    cmds:
      - rm -rf {{.RUN_DIR}} bin .next

  clean:ml:
    desc: Remove the Python venv, ONNX models, imagery cache, and caches
    cmds:
      - rm -rf {{.VENV}} scripts/ml/models/*.onnx data/imagery .pytest_cache
      - find scripts -type d -name __pycache__ -prune -exec rm -rf {} +

  scene:extract:
    desc: Extract reviewable objects across captured map images
    cmds:
      - '{{.PYTHON}} -m scripts.ml.scene_extract {{.CLI_ARGS}}'

  scene:house-batch:
    desc: Freeze a reference and analyse additional houses without replacing saved scenes
    cmds:
      - '{{.PYTHON}} -m scripts.ml.scene_house_batch {{.CLI_ARGS}}'

  scene:self-review:
    desc: Audit model roofs and optionally publish bounded, independently checked repairs
    cmds:
      - '{{.PYTHON}} -m scripts.ml.scene_self_review {{.CLI_ARGS}}'

  scene:review-loop:
    desc: Compare low-evidence roof candidates in isolated, resumable batches
    cmds:
      - '{{.PYTHON}} -m scripts.ml.roof_review_loop {{.CLI_ARGS}}'

  harness:cases:
    desc: 'Build or list the offline Harness² case set from human-reviewed scene objects, e.g. CLI_ARGS="build" | "build --tasks outline --kinds building" | "list"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing cases {{.CLI_ARGS}}'

  harness:check:
    desc: 'Preflight the Harness² loop: executor CLI, base harness snapshot and the stdio case server, e.g. CLI_ARGS="--executor claude --live"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing check {{.CLI_ARGS}}'

  harness:run:
    desc: 'Refine the tracing agent harness with Propose–Probe–Compose over the case stream (model-backed; resumable), e.g. CLI_ARGS="--k 1 --mode parallel --only-domains roof-outline --max-tasks 2" (add --dry-run to see the plan)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing run {{.CLI_ARGS}}'

  harness:rollout:
    desc: 'One tracing-agent rollout on one case with the operator-only judge printed; --label base1 lets a later harness:run reuse it, e.g. CLI_ARGS="--case CASE_ID --max-budget-usd 3"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing rollout {{.CLI_ARGS}}'

  harness:eval:
    desc: 'Replay an adopted harness (case facts stripped) against the base on held-out cases, paired per case (rollouts only), e.g. CLI_ARGS="--harness data/harness/runs/<ns>/<case>/harnesses/agg1 --label first --only-domains roof-outline --max-tasks 4 --dry-run"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing eval {{.CLI_ARGS}}'

  harness:judge:
    desc: 'Judge adopted (or --bases) Harness² rollouts against held-out human outlines and decisions, e.g. CLI_ARGS="--k 1 --mode parallel"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing judge {{.CLI_ARGS}}'

  harness:report:
    desc: 'Summarise judged Harness² runs per mode and domain, with the base-harness comparison and spend, e.g. CLI_ARGS="--k 1 --mode parallel"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing report {{.CLI_ARGS}}'

  harness:promote:
    desc: 'Export a domain library''s adopted addr-roof-tracing skill edits as a patch plus lessons, e.g. CLI_ARGS="--k 1 --mode parallel --domain roof-outline" (add --apply to write them)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing promote {{.CLI_ARGS}}'

  harness:fieldwork:
    desc: 'Fieldwork review items + pulled human words as Harness² cases ("cases" -> data/harness/cases-fieldwork), and adopted assessments back as SaveAgentReview agent history ("post", a plan unless --live; the live origin also needs FIELDWORK_PUSH_ALLOW_LIVE=1), e.g. CLI_ARGS="cases" | "post --k 1 --mode parallel" | "post --k 1 --mode parallel --origin http://127.0.0.1:18095 --live". Refine them with harness:run CLI_ARGS="--cases-dir data/harness/cases-fieldwork --runs-dir data/harness/runs-fieldwork ..."'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing fieldwork {{.CLI_ARGS}}'

  harness:cycle:
    desc: 'One self-improvement cycle from the lineage head: refine on TRAIN cases, consolidate one general edit with train feedback, gate it on VALIDATION, admit on a pass, e.g. CLI_ARGS="--domain roof-outline --inner rollouts --train-cases 12 --budget-usd 20" (add --dry-run for the plan)'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing cycle {{.CLI_ARGS}}'

  harness:gate:
    desc: 'Gate a candidate harness (e.g. from harness:candidate) against the lineage head on validation cases, repeated, with the noise floor, e.g. CLI_ARGS="--candidate DIR --label NAME --domain roof-outline --dry-run"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing gate {{.CLI_ARGS}}'

  harness:candidate:
    desc: 'Write an engineered candidate harness (lineage head + a named component such as edge-profile) for harness:gate, e.g. CLI_ARGS="edge-profile --base head --out data/harness/runs/candidates/edge-profile"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing candidate {{.CLI_ARGS}}'

  harness:confirm:
    desc: 'Confirm an admitted lineage version against its parent on TEST cases; only a confirmed version writes a reviewable promotion patch, e.g. CLI_ARGS="--version 2 --domain roof-outline --dry-run"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing confirm {{.CLI_ARGS}}'

  harness:lineage:
    desc: List the base-harness lineage with gate and test-confirmation status
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing lineage {{.CLI_ARGS}}'

  harness:trace:
    desc: 'Trace flywheel: roll the lineage head repeatedly on unreviewed objects (cases from "harness:cases CLI_ARGS=unlabeled"), then rank and stage them with harness:fieldwork CLI_ARGS="queue --label ...", e.g. CLI_ARGS="--cases-dir data/harness/cases-unlabeled --label u1 --repeats 2 --dry-run"'
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing trace {{.CLI_ARGS}}'

  harness:demo:
    desc: Run the whole Harness² loop deterministically on synthetic roofs (no model calls)
    cmds:
      - '{{.PYTHON}} -m scripts.ml.harnessing demo {{.CLI_ARGS}}'

