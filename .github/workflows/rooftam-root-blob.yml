name: Prepare root Taskfile blob
on:
  push:
    branches: [feat/rooftam-taskfiles-20261114]
    paths: ['.github/workflows/rooftam-root-blob.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'castlemilk/addr'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the single include insertion without changing service tasks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          source = Path('Taskfile.yml').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(source)).encode()+b'\0'+source).hexdigest() == 'b942d8190b67677acd875dc491f875f80e4a1a77'
          header = b"version: '3'\n\n"
          addition = b'includes:\n  rooftam: ./Taskfile.rooftam.yml\n\n'
          assert source.startswith(header) and b'includes:' not in source
          edited = source.replace(header, header+addition, 1)
          Path('/tmp/root-taskfile-blob.json').write_text(json.dumps({'content': edited.decode(), 'encoding': 'utf-8'}))
          print('Expected blob:', hashlib.sha1(b'blob '+str(len(edited)).encode()+b'\0'+edited).hexdigest())
          PY
      - name: Store unattached blob only; no branch or service changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/castlemilk/addr/git/blobs --input /tmp/root-taskfile-blob.json --jq '.sha'
