name: RoofTAM Go CLI
on:
  pull_request:
    paths:
      - 'tools/rooftam/**'
      - '.github/workflows/rooftam-cli.yml'
  push:
    branches: [main]
    paths:
      - 'tools/rooftam/**'
      - '.github/workflows/rooftam-cli.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rooftam-cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/rooftam
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/rooftam/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Format, race tests, embedded runner syntax and vet
        run: |
          test -z "$(gofmt -l *.go)"
          go test -race -coverprofile=coverage.out ./...
          go vet ./...
          python -m py_compile runner.py
      - name: Build standalone controllers
        run: |
          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/rooftam-$os-$arch" .
            done
          done
          (cd dist && sha256sum rooftam-* > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: rooftam-cli-binaries
          path: tools/rooftam/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rooftam-cli-coverage
          path: tools/rooftam/coverage.out
