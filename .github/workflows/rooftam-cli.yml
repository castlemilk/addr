name: RoofTAM Go CLI
on:
  pull_request:
    paths:
      - 'Taskfile.yml'
      - 'Taskfile.addr.yml'
      - 'tools/rooftam/**'
      - '.github/workflows/rooftam-cli.yml'
  push:
    branches: [main]
    paths:
      - 'Taskfile.yml'
      - 'Taskfile.addr.yml'
      - 'tools/rooftam/**'
      - '.github/workflows/rooftam-cli.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rooftam-cli-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/rooftam/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: go-task/setup-task@v1
        with:
          version: '3.52.0'
      - name: Lint, race tests and Task integration contracts (no Kaggle compute)
        run: task rooftam:check
      - name: Cross-build controllers through Task
        run: task rooftam:build:all
      - uses: actions/upload-artifact@v4
        with:
          name: rooftam-cli-binaries
          path: tools/rooftam/dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rooftam-cli-coverage
          path: tools/rooftam/coverage.out
