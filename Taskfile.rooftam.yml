version: '3'

# Root-level RoofTAM tasks, included by Taskfile.yml as rooftam:<task>.
# Explicit directories also support task -t Taskfile.rooftam.yml <task>.
# Preserve existing relative run paths under tools/rooftam.
vars:
  ROOFTAM_PYTHON: '{{.ROOFTAM_PYTHON | default "python3"}}'

tasks:
  default:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: List RoofTAM tasks (no build, authentication or submission)
    silent: true
    cmds:
      - task --taskfile {{printf "%s/Taskfile.rooftam.yml" .ROOT_DIR | shellQuote}} --list

  build:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Build the local Go controller (includes the embedded Python runner)
    run: once
    cmds:
      # Go already caches compilation. Always invoke it so runner.py, Go version,
      # build flags and host architecture cannot leave a stale controller.
      - GOWORK=off go build -trimpath -o './rooftam{{exeExt}}' .

  install:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Install the controller into GOBIN or GOPATH/bin
    cmds:
      - GOWORK=off go install -trimpath .

  build:all:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Cross-build Linux/macOS amd64/arm64 controllers and SHA256SUMS
    cmds:
      - mkdir -p dist
      - |
        for os in linux darwin; do
          for arch in amd64 arm64; do
            GOWORK=off CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist/rooftam-$os-$arch" .
          done
        done
      - |
        {{.ROOFTAM_PYTHON | shellQuote}} -c 'import hashlib,pathlib; p=pathlib.Path("dist"); names=["rooftam-"+os+"-"+arch for os in ("linux","darwin") for arch in ("amd64","arm64")]; (p/"SHA256SUMS").write_text("".join(hashlib.sha256((p/n).read_bytes()).hexdigest()+"  "+n+"\n" for n in sorted(names)))'

  fmt:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Format the Go controller sources
    cmds:
      - gofmt -w *.go

  lint:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Check Go formatting, vet and Python syntax without installing ML dependencies
    cmds:
      - |
        files="$(gofmt -l *.go)"
        if [ -n "$files" ]; then
          printf 'Run task rooftam:fmt; unformatted files:\n%s\n' "$files"
          exit 1
        fi
      - GOWORK=off go vet ./...
      - |
        {{.ROOFTAM_PYTHON | shellQuote}} -c 'from pathlib import Path; [compile(p.read_text(), str(p), "exec") for p in (Path("runner.py"), Path("test_taskfile.py"))]'

  test:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Run controller race tests and write coverage.out (no Kaggle calls)
    cmds:
      - GOWORK=off go test -race -coverprofile=coverage.out {{.CLI_ARGS}} ./...

  test:tasks:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Exercise Task routing, argument quoting and cleanup with fake commands
    cmds:
      - '{{.ROOFTAM_PYTHON | shellQuote}} test_taskfile.py'

  check:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Run lint, Go tests and Task integration tests; never submit compute
    cmds:
      - task: lint
      - task: test
      - task: test:tasks

  help:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Show CLI flags and exit-code meanings
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} --help'

  setup:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Install the pinned official Kaggle client in its isolated user environment
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} setup {{.CLI_ARGS}}'

  auth:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Sign in through the official Kaggle OAuth flow
    deps: [build]
    interactive: true
    silent: true
    cmds:
      - './rooftam{{exeExt}} auth {{.CLI_ARGS}}'

  doctor:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Check client capabilities and account access (read-only)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} doctor {{.CLI_ARGS}}'

  onboard:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Build, install the Kaggle client, sign in and check access; does not submit
    interactive: true
    cmds:
      - task: setup
      - task: auth
      - task: doctor

  prepare:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Prepare a pinned private notebook without submitting (--owner USER --output DIR)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} prepare {{.CLI_ARGS}}'

  run:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Submit ONE private TPU experiment, wait, download and verify (--owner USER --output DIR)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} run {{.CLI_ARGS}}'

  submit:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Submit an already prepared run once, then detach (--run DIR)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} submit {{.CLI_ARGS}}'

  status:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Read the status of an existing run (--run DIR)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} status {{.CLI_ARGS}}'

  logs:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Retrieve execution logs for an existing run (--run DIR)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} logs {{.CLI_ARGS}}'

  wait:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Wait for an existing run without resubmitting (--run DIR)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} wait {{.CLI_ARGS}}'

  download:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Download artifacts for an existing run (--run DIR)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} download {{.CLI_ARGS}}'

  resume:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Reconnect, wait, download and verify the SAME run; never resubmit (--run DIR)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} resume {{.CLI_ARGS}}'

  verify:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Verify downloaded execution evidence offline (--run DIR)
    deps: [build]
    silent: true
    cmds:
      - './rooftam{{exeExt}} verify {{.CLI_ARGS}}'

  clean:
    dir: '{{.ROOT_DIR}}/tools/rooftam'
    desc: Remove controller binaries and coverage ONLY; preserve runs, logs, auth and environments
    cmds:
      - rm -f ./rooftam ./rooftam.exe ./coverage.out
      - rm -f ./dist/rooftam-linux-amd64 ./dist/rooftam-linux-arm64 ./dist/rooftam-darwin-amd64 ./dist/rooftam-darwin-arm64 ./dist/SHA256SUMS
